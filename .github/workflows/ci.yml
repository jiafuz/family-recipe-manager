name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - dev2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format, type and test
        run: npm run check

      - name: Build API
        run: npm run build --workspace @jiayan/api

      - name: Build WeChat mini program
        run: npm run build:weapp
