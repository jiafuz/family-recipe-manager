services:
  mysql:
    image: mysql:8.4
    container_name: jiayan-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${JIAYAN_DB_NAME:-jiayan}
      MYSQL_USER: ${JIAYAN_DB_USER:-jiayan}
      MYSQL_PASSWORD: ${JIAYAN_DB_PASSWORD:-jiayan-local-only}
      MYSQL_ROOT_PASSWORD: ${JIAYAN_DB_ROOT_PASSWORD:-jiayan-root-local-only}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${JIAYAN_DB_ROOT_PASSWORD:-jiayan-root-local-only}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - jiayan-mysql-data:/var/lib/mysql

volumes:
  jiayan-mysql-data:
